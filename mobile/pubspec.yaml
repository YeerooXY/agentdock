name: agent_dock_mobile
description: A private Android companion for Paddock terminals and results.
publish_to: 'none'
version: 0.6.0-preview.22+22

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  xterm: ^4.0.0
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.4.2
  crypto: ^3.0.7
  flutter_markdown_plus: ^1.0.12
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/textures/
    - assets/providers/openai.png
    - assets/providers/claude.png
    - assets/providers/cursor.png
    - assets/providers/opencode.png
    - assets/providers/cline.png
    - assets/providers/gemini.png
    - assets/providers/antigravity.png
    - assets/providers/kiro.png
    - assets/providers/droid.png
    - assets/providers/pi.png
    - assets/providers/zai.png
    - assets/providers/ollama.png
